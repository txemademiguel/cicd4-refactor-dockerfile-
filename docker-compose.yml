version: '3.8'

services:
  php-app:
    # Construye la imagen usando el Dockerfile de este directorio
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-app
    ports:
      - "8080:80"        # Mapea el puerto 8080 del host al 80 del contenedor
    volumes:
      - ./src:/var/www/html
